# THE production deploy workflow for playapp.emw4u.com (GitHub Pages, custom domain).
# GitHub Pages here is build_type=workflow, so this file is what publishes the site.
# It builds the Vite app and deploys ./dist — it injects NO secrets/env vars, so the
# published bundle contains no credentials (Supabase/MCP stay unset → offline mode).
# NOTE: previously lived under the misleading name jekyll-gh-pages.yml; do not delete —
# removing it silently stops all deployments.
name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
